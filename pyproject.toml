[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gost-espd-checker"
version = "0.1.0"
description = "Checks program documents against the GOST ESPD standards"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx==1.2.0",
    "PyYAML==6.0.3",
    "typing_extensions>=4.4",
]

[project.scripts]
gost-espd-checker = "gost_espd_checker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest-eo @ git+https://github.com/RaulIQ/pytest-eo@a963ffe0b4ded8c0edaad468234d5cb7ed5a6261",
    "PyHamcrest==2.1.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gost_espd_checker"]

[tool.eo]
paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
